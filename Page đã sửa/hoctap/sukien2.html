<!-- COMMENT -->

<h3>Bình luận</h3>

<div style="display:flex;gap:10px;padding:10px;background:#111;border-radius:12px;">

<input id="commentInput"
placeholder="Viết bình luận..."
style="flex:1;padding:12px;border-radius:8px;border:none;background:#1a1d21;color:#fff;">

<button onclick="addComment()"
style="padding:10px 18px;border:none;border-radius:8px;background:#6a5af9;color:#fff;">
Gửi
</button>

</div>

<div id="commentList" style="margin-top:15px;"></div>

</div>

</div>
</details>

<script>
// ❤️ LIKE
function toggleLove(el){
    el.classList.toggle("active");
    el.style.background = el.classList.contains("active") ? "#ff4d6d" : "#111";
}

// 🛒 CART
function addCart(){
    alert("Đã thêm vào giỏ hàng!");
}

// COMMENT
const eventId = "event1";
let comments = JSON.parse(localStorage.getItem("comments_" + eventId)) || [];

function addComment(){
    const input = document.getElementById("commentInput");

    if(input.value.trim() === "") return;

    comments.push(input.value);
    localStorage.setItem("comments_" + eventId, JSON.stringify(comments));

    renderComments();
    input.value = "";
}

function renderComments(){
    const list = document.getElementById("commentList");
    list.innerHTML = "";

    comments.forEach(cmt => {
        const p = document.createElement("p");
        p.innerText = cmt;
        p.style.background = "#1a1d21";
        p.style.padding = "10px";
        p.style.borderRadius = "8px";
        p.style.marginTop = "10px";
        list.appendChild(p);
    });
}

renderComments();
</script>
