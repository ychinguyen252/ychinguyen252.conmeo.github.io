        </a>
    </div>
</header>

<section class="section">
    <h2> Sự kiện bạn đã lưu</h2>

    <div id="fav-list" class="grid-3"></div>

    <p id="empty" style="text-align:center; margin-top:20px; color:#777;">
        Bạn chưa có sự kiện yêu thích nào được lưu. Hãy khám phá và thêm vào danh sách yêu thích của bạn!
    </p>
</section>

<script>
    const favList = document.getElementById("fav-list");
const emptyText = document.getElementById("empty");

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

function render() {
    favList.innerHTML = "";

    if (favorites.length === 0) {
        emptyText.style.display = "block";
        return;
    }

    emptyText.style.display = "none";

    favorites.forEach(item => {
        const div = document.createElement("div");

        div.innerHTML = `
            <h3>${item.name}</h3>
            <button onclick="removeFav('${item.id}')">❌ Xóa</button>
        `;

        favList.appendChild(div);
    });
}

function removeFav(id) {
    favorites = favorites.filter(i => i.id !== id);
    localStorage.setItem("favorites", JSON.stringify(favorites));
    render();
}

render();
</script>

</body>
</html>
